version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ${GHCR_REPOSITORY:-local/cms}:${APP_VERSION:-latest}
    container_name: cms_app
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_PORT=3000
      - DATABASE_URL=postgresql://cms_user:${DB_PASSWORD}@db:5432/cms_db?schema=public
      - SESSION_SECRET=${SESSION_SECRET}
      - UPLOAD_MAX_SIZE=10485760
      - UPLOAD_ALLOWED_TYPES=image/jpeg,image/png,image/webp,image/gif,image/svg+xml
      - BCRYPT_ROUNDS=12
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - SITE_NAME=${SITE_NAME:-Mijn Website}
      - SITE_DESCRIPTION=${SITE_DESCRIPTION:-Een professionele website}
      - DEFAULT_LANGUAGE=nl
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cms_network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx

  db:
    image: postgres:16-alpine
    container_name: cms_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cms_db
      - POSTGRES_USER=cms_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_user -d cms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cms_network
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local

networks:
  cms_network:
    driver: bridge
    name: cms_network
